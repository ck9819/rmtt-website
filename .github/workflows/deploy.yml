name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      # Lovable-hosted images are only pointers in the repo. Pull them from the published
      # site at build time until they are committed to public/images/assets/.
      - name: Fetch Lovable-hosted images
        run: node scripts/fetch-assets.mjs https://rmtt-website.lovable.app
      - run: npm run build
      - name: Check no Lovable image links remain
        run: |
          if grep -rq "/__l5e/" dist; then echo "::error::dist still references /__l5e/ image URLs"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
